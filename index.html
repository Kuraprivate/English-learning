<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mantis Hour">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>The Mantis Hour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: greenhouse-glass study desk — sticky tab bar, a reading column for the novel, a card grid for the word book, and one bottom sheet for word details. */
:root{
  --bg:#E7ECE6; --panel:#F6F8F4; --ink:#1D2620; --muted:#5D6B61; --line:#C9D3CA;
  --accent:#2F6A44; --accent-soft:#D5E5D7; --blood:#9A2E2A; --blood-soft:#F1DCD8; --hl:#E9DFA8;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(20,40,28,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --panel:#18221C; --ink:#E3EAE3; --muted:#9AAA9F; --line:#2C3A31;
  --accent:#86BC93; --accent-soft:#22362A; --blood:#E08A80; --blood-soft:#3A2321; --hl:#4A4524;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --panel:#18221C; --ink:#E3EAE3; --muted:#9AAA9F; --line:#2C3A31;
  --accent:#86BC93; --accent-soft:#22362A; --blood:#E08A80; --blood-soft:#3A2321; --hl:#4A4524;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,7vw,68px);line-height:1;margin:6px 0 6px;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.lede{color:var(--muted);margin:0;max-width:60ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:18px}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 15px var(--f-ui);padding:14px 14px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 80px}

/* word book */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 240px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:15px var(--f-ui)}
.stat{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:13px var(--f-ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.known{opacity:.62}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.w{font-family:var(--f-read);font-weight:600;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.cat{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.ja{font-weight:700}
.def{color:var(--muted);font-size:14px}
.ex{font-family:var(--f-read);font-style:italic;font-size:14px;border-left:2px solid var(--accent-soft);padding-left:10px}
.exja{font-size:13px;color:var(--muted);padding-left:12px}
.inStory{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.star{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;font:12px var(--f-ui);padding:3px 8px;cursor:pointer;white-space:nowrap}
.star.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.badge{display:inline-block;font:500 11px var(--f-ui);color:var(--blood);background:var(--blood-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}
.sims{display:flex;flex-direction:column;gap:5px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line)}
.sims .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.sim{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:14px}
.sim b{font-family:var(--f-read);font-weight:600}
.sim span{color:var(--muted)}
.empty{color:var(--muted);padding:30px 0}

/* story */
.story{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc button{text-align:left;border:0;background:none;color:var(--muted);font:14px var(--f-ui);padding:8px 10px;border-radius:6px;cursor:pointer}
.toc button .n{font-family:var(--f-mono);font-size:11px;display:block;letter-spacing:.1em}
.toc button[aria-current="true"]{background:var(--panel);color:var(--ink)}
.reader{max-width:66ch}
.case{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--blood);text-transform:uppercase}
.reader h2{font-family:var(--f-display);font-size:clamp(32px,5vw,46px);line-height:1.05;margin:6px 0 22px;text-wrap:balance}
.reader p{font-family:var(--f-read);font-size:18px;line-height:1.75;margin:0 0 1.1em}
.reader p.letter{font-style:italic}
.reader p.note{font-family:var(--f-mono);font-size:15px;background:var(--blood-soft);color:var(--ink);padding:14px 16px;border-radius:4px;line-height:1.6}
.vw{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1.5px dotted var(--accent);line-height:inherit}
.vw:hover,.vw.active{background:var(--hl)}
details.sum{margin:28px 0 18px;border-top:1px solid var(--line);padding-top:16px}
details.sum summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.sum p{font-family:var(--f-ui);font-size:15px;line-height:1.8}
.chwords{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chwords .chip{font-family:var(--f-read)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:8px;padding:10px 16px;font:500 15px var(--f-ui);cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn[disabled]{opacity:.35;cursor:default}
.tip{font-size:13px;color:var(--muted);margin:0 0 18px}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);box-shadow:var(--shadow);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}
.sheet .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.sheet .w{font-size:24px}
.sheet .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px}

/* flash */
.flash{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.fc{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:260px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer}
.fc .w{font-size:30px}
.fc .hint{font-size:13px;color:var(--muted)}
.frow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:14px var(--f-ui)}
@media (max-width:760px){
  .story{grid-template-columns:minmax(0,1fr);gap:16px}
  .toc{position:static;flex-direction:row;overflow-x:auto}
  .toc button{white-space:nowrap}
  .reader p{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>

<header class="top wrap">
  <div class="eyebrow">Vocabulary Case File · No. 1103</div>
  <h1>The <em>Mantis</em> Hour</h1>
  <p class="lede">ノートの単語・イディオムを単語帳にまとめ、それを使ったどんでん返しサスペンスを書き下ろした。本文の点線の単語をタップすると意味と使い方が出る。</p>
</header>

<nav class="tabs" aria-label="セクション">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="t-story" aria-selected="true" data-view="story">小説を読む</button>
    <button class="tab" role="tab" id="t-book" aria-selected="false" data-view="book">単語帳</button>
    <button class="tab" role="tab" id="t-scene" aria-selected="false" data-view="scene">場面別単語</button>
    <button class="tab" role="tab" id="t-phrase" aria-selected="false" data-view="phrase">日常表現</button>
    <button class="tab" role="tab" id="t-flash" aria-selected="false" data-view="flash">フラッシュカード</button>
  </div>
</nav>

<main class="wrap">
  <section id="v-story" class="story">
    <div class="toc" id="toc"></div>
    <article class="reader" id="reader"></article>
  </section>

  <section id="v-book" hidden>
    <div class="tools">
      <input type="search" id="q" placeholder="英語・日本語で検索（例: grudge / 恨み）">
      <button class="chip" id="hideKnown" aria-pressed="false">覚えた単語を隠す</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="chips" id="cats"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="v-scene" hidden>
    <p class="tip">家・駅・外・学校・会社・職業の場面別に400語。<span class="badge">意外と知らない</span> は、よく使うのに日本人が知らない・和製英語と混同しやすい語。</p>
    <div class="tools">
      <input type="search" id="sq" placeholder="検索（例: outlet / コンセント）">
      <button class="chip" id="sTricky" aria-pressed="false">意外と知らない語だけ</button>
      <button class="chip" id="sHide" aria-pressed="false">覚えた単語を隠す</button>
      <span class="stat" id="sstat"></span>
    </div>
    <div class="chips" id="scats"></div>
    <div class="grid" id="sgrid"></div>
  </section>

  <section id="v-phrase" hidden>
    <p class="tip">日常会話でよく使う表現100個。それぞれに言い換え表現とニュアンスの違いを付けた。</p>
    <div class="tools">
      <input type="search" id="pq" placeholder="検索（例: tired / 疲れ）">
      <button class="chip" id="pHide" aria-pressed="false">覚えた表現を隠す</button>
      <span class="stat" id="pstat"></span>
    </div>
    <div class="chips" id="pcats"></div>
    <div class="grid" id="pgrid"></div>
  </section>

  <section id="v-flash" hidden>
    <div class="flash">
      <div class="frow">
        <select id="fcat" aria-label="カテゴリー"></select>
        <select id="fdir" aria-label="出題の向き">
          <option value="en">英語 → 日本語</option>
          <option value="ja">日本語 → 英語</option>
        </select>
      </div>
      <div class="fc" id="fc" tabindex="0" role="button" aria-label="カードをめくる"></div>
      <div class="frow">
        <button class="btn ghost" id="fagain">もう一度</button>
        <button class="btn" id="fknow">覚えた</button>
      </div>
      <div class="stat" id="fstat" style="text-align:center"></div>
    </div>
  </section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-label="単語の説明">
  <div class="in">
    <div class="row"><span class="cat" id="s-cat"></span><button class="x" id="s-close" aria-label="閉じる">×</button></div>
    <div class="w" id="s-w"></div>
    <div class="ja" id="s-ja"></div>
    <div class="def" id="s-def"></div>
    <div class="ex" id="s-ex"></div>
    <div class="exja" id="s-exja"></div>
    <div class="row" style="justify-content:flex-start;margin-top:6px"><button class="star" id="s-star">☆ 覚えた</button></div>
  </div>
</div>

<script>
const SC={H:"家",T:"駅・電車",O:"外（公園・道路・店）",K:"学校",W:"会社",J:"職業"};
const RAW2=`
H||faucet|蛇口（米。英国では tap）|a device that controls water flow from a pipe|Turn off the faucet while you brush.|歯を磨く間は蛇口を閉めて。
H||drain|排水口／水を切る|a hole where water flows away; to let liquid flow out|Hair is blocking the drain.|髪の毛が排水口を詰まらせている。

H||cutting board|まな板|a board for cutting food on|Use the cutting board, not the counter.|カウンターじゃなくまな板を使って。

H||kettle|やかん、電気ケトル|a pot for boiling water|Put the kettle on.|お湯を沸かして。

H||cupboard|食器棚、戸棚|a cabinet with shelves and doors|The cups are in the top cupboard.|コップは上の戸棚にある。
H|*|pantry|食品庫|a small room or cupboard for storing food|We keep rice in the pantry.|米は食品庫に置いている。
H|*|leftovers|残り物|food not eaten at a meal, kept for later|We had leftovers for lunch.|昼は残り物を食べた。
H||microwave|電子レンジ（で温める）|an oven using radio waves; to heat in one|Microwave it for two minutes.|レンジで2分温めて。
H||dishwasher|食洗機|a machine that washes dishes|Load the dishwasher, please.|食洗機に食器を入れて。

H||sponge|スポンジ|a soft object for washing|This sponge is getting old.|このスポンジはもう古い。
H|*|detergent|洗剤|soap for washing dishes or clothes|We're out of laundry detergent.|洗濯洗剤が切れた。
H|*|plastic wrap|ラップ（cling film は英国）|thin plastic for covering food|Cover the bowl with plastic wrap.|ボウルにラップをかけて。
H||aluminum foil|アルミホイル|thin metal sheet for cooking|Wrap the fish in aluminum foil.|魚をホイルで包んで。
H|*|food container|保存容器（Tupperware は商標）|a box for storing food|Put the curry in a food container.|カレーを保存容器に入れて。
H||trash can|ゴミ箱（米。英国は bin）|a container for garbage|The trash can is full.|ゴミ箱がいっぱいだ。
H|*|burnable trash|可燃ごみ|garbage that can be burned|Burnable trash goes out on Tuesday.|可燃ごみは火曜日。
H||recycling|リサイクル、資源ごみ|collecting used items to reuse|Cans go in the recycling.|缶は資源ごみへ。
H||take out the trash|ゴミを出す|to carry garbage outside for collection|Can you take out the trash?|ゴミ出ししてくれる？
H||doormat|玄関マット|a mat at the door to wipe shoes|Wipe your feet on the doormat.|玄関マットで足をふいて。

H|*|banister|（階段の）手すり|the rail along the side of stairs|Hold the banister on the stairs.|階段では手すりにつかまって。

H||drawer|引き出し|a box that slides in and out of furniture|The scissors are in the top drawer.|はさみは一番上の引き出し。

H|*|hang out the laundry|洗濯物を干す|to put wet clothes outside to dry|It might rain, so don't hang out the laundry.|雨が降りそうだから洗濯物は干さないで。
H||fold|たたむ|to bend cloth or paper neatly|Can you fold the towels?|タオルをたたんでくれる？
H||iron|アイロン（をかける）|a hot tool for removing creases|I need to iron my shirt.|シャツにアイロンをかけないと。
H|*|fabric softener|柔軟剤|liquid that makes washed clothes soft|This fabric softener smells nice.|この柔軟剤いい匂い。

H|*|clutter|散らかった物|many things lying in an untidy way|My desk is covered in clutter.|机がごちゃごちゃだ。

H|*|declutter|不要品を処分する、断捨離|to remove things you don't need|I decluttered my closet this weekend.|週末にクローゼットを断捨離した。

{t:"The Inaugural Night",sum:"語り手ジュリアンは「隠し事はない」と言いながら、あの夜を書き記す。叔母マーガレットは高級テラリウム会社の経営者で、実は破産寸前。ガラス博物館の初開催の夜、恨みを持つ昆虫商人サイラス、冷遇されて解雇された元助手ルース、パーティー嫌いのオカフォー警部が集う。叔母は「カマキリは追わない、獲物の方からやって来る」と語る。11時42分、停電。明かりが戻ると、カマキリのケースは割れ、叔母は消え、お守りだけが残されていた。",
p:`People say I {{dwell on}} the past. Maybe they are right. I {{hardly ever}} talk about that night, and I {{never}} talk about it sober. But the detective asked me to write it all down, so here it is. I'm an {{open book}}. I {{always}} have been.

My aunt, Margaret Hale, was the {{proprietor}} of Hale & Glass, a company that built {{terrariums|terrarium}} for rich people who wanted a {{miniature}} jungle in the living room. She was {{meticulous}}, {{ostentatious}}, and absolutely {{one of a kind}}. She was also, though almost nobody knew it yet, close to {{insolvency}}.

On the third of October she held the {{inaugural}} night of the Glass Garden, her new museum of living things. The guests were exactly who you would expect: investors in {{chic}}, {{pricey}} suits, a few journalists, and Detective Inspector Grace Okafor, who {{rarely}} went to parties and looked like she was already regretting this one.

There were also two people who should not have been there. Silas Brandt, a {{merchant}} who sold rare insects, had held a {{grudge}} against my aunt for years; she had once {{accused|accuse of}} him of {{fraud}} in front of the whole industry. And Ruth Abernathy, her former assistant, had been fired in June with a {{severance}} payment so small she called it an insult.

Earlier that evening the hall lights had flickered, and I had asked Silas, of all people, to {{give me a hand|give a hand}} with the {{fuse box}}. He grumbled, but he helped. Merchants {{generally}} do, when a Hale asks nicely.

"Don't look so {{lethargic}}, Julian," my aunt said, handing me a glass of champagne. I {{sipped|sip}} mine; she {{gulped|gulp}} hers. "You're a {{night owl}}. This is your hour." Then she gave me one of her rare {{compliments|compliment}}. "You have {{shades of}} your father tonight. He was good at waiting, too."

In the center of the hall stood her favorite exhibit: a tall glass case holding a single {{praying mantis}} and a handful of {{grasshoppers|grasshopper}}. "The mantis never chases," she told the crowd. "It waits. The {{prey}} always comes to the {{predator}}." Everyone laughed. I didn't.

At 11:42 the lights died. I know the exact minute because I was looking at my watch. Glass broke somewhere in the dark, and someone screamed. When the lights came back ninety seconds later, the mantis case lay in pieces, the grasshoppers had {{scattered|scatter}} across the floor, and my aunt was gone. On the spot where she had stood lay her silver beetle {{charm}}, the one she wore to {{ward off}} bad luck.`},
{t:"The Note",sum:"翌朝、ジュリアン宛てに身代金要求の手紙が届く。「牧草地のそばの歪んだ小屋に置け。くよくよするな、ジュリアン」。オカフォーは呆れ顔。マスコミが殺到し、温室の壁には「バッタは気づかない」の落書き。恨みとアリバイのなさからサイラスが疑われる。ルースは「会社は負債と訴訟で沈みかけていた」と明かし、「誘拐犯なんていないのかも」とつぶやく。ジュリアンは捜索に加わり、「叔母は沼地を嫌っていた、探しても無駄だ」と警部に念を押す。",
p:`The {{ransom}} note arrived the next morning, addressed to me. It was {{scrawled|scrawl}} in thick black marker:

[note]Five million. No police. Leave it under the {{crooked}} hut by the {{meadow}}. Don't {{dwell on}} it, Julian. Just pay.

Detective Okafor read it twice and {{rolled her eyes|roll one's eyes}}. "No police," she said. "They {{always}} write that. And they always know we'll come anyway." To her it was a simple {{kidnapping}} with {{extortion}} attached. To the newspapers it was {{unprecedented}}: the queen of glass, stolen from her own glass house.

For the next week, reporters {{thronged|throng}} at the gates of the Glass Garden, and one night someone sprayed {{graffiti}} across the greenhouse wall in red paint: THE GRASSHOPPER NEVER SEES IT COMING.

The police {{suspected|suspect}} Silas first. He had a grudge, he had no {{alibi}}, and his fingerprints were all over the fuse box. When they questioned him, he {{kept his cool|keep one's cool}} for about ten minutes, then began to {{heckle}} the officers and shout that Margaret had {{robbed him of|rob of}} his career and now she was robbing him of his freedom.

Ruth was more helpful. She invited me to her small flat and made tea. "Your aunt was drowning, Julian," she said quietly. "The company had huge {{liabilities|liability}}. The tax office was about to {{levy}} a penalty, and there was a {{litigation}} case she could never win. She was barely {{keeping her head above water|keep one's head above water}}."

"Then why would anyone kidnap her?" I asked. "There's nothing left to take."

Ruth looked at me for a long moment. "Maybe nobody did," she said.

I joined the search teams every day. I {{trekked|trek}} through the woods and over the hills, and I told Okafor everything I knew about my aunt's habits. "Don't waste time on the marsh," I said. "She hated {{boggy}} ground. She would never go near it, not even at gunpoint."

Okafor wrote that down. She writes everything down. "Stay {{on your toes|stay on one's toes}}, Mr. Hale," she said. "People who {{dwell on}} things tend to notice things."`},
{t:"The Second Phone",sum:"10日後、ジュリアンは叔母の書斎で机の裏に貼られた使い捨て携帯を偶然見つける。中のメッセージは衝撃的だった。「11時42分に消灯」「お守りを置いて」「罪はサイラスに」。叔母は誘拐を自作自演し、破産と訴訟から逃れ、宿敵サイラスに罪を着せようとしていたのだ（第1のどんでん返し）。ジュリアンは警部に届け、共犯者はルースではと示唆する。だが相手の番号は既に解約され、翌朝には携帯のメッセージも遠隔で消去されていた。",
p:`Ten days later, I {{stumbled upon|stumble upon}} it. I was searching my aunt's study for insurance papers when I found a second phone taped beneath her desk drawer: a cheap {{burner phone}}, the kind criminals use in films.

The messages on it left me {{paralyzed|be paralyzed}}. They were between Margaret and a single unknown number, and they began a month before the party.

[note]Lights out at 11:42. Ninety seconds. Leave the charm so it looks real.

[note]Silas takes the blame. He deserves it.

My aunt had not been kidnapped. She had staged the whole thing. The insolvency, the lawsuits, the old {{grudge}}: she had found a way to escape all of them at once. Disappear, let the world believe she was a {{victim}}, and let her old enemy be {{convicted of}} a crime he did not commit. It was {{atrocious}}. It was also, I had to admit, very much like her.

I took the phone straight to Okafor. She read every message without changing her expression. "Who's the other number?" she asked.

"Her {{accomplice}}," I said. "Someone helped her. Someone cut the power at exactly 11:42."

"Ruth?"

I hesitated. "Maybe. She knew more than she told me. She said maybe nobody kidnapped my aunt at all. How would she know that?"

Okafor looked at me the way the mantis had looked at the grasshoppers. "Interesting," she said, and wrote that down too.

But when the police traced the number, it was already dead. And when the technicians opened the phone again the next morning, the messages were gone, deleted remotely during the night. All that was left was my word and a {{plausible}} story that nobody could {{substantiate}}.

"We're not {{in the same boat}}, you and I," Okafor told me as I left. "You only need to believe a story. I need to prove one."`},
{t:"The Verdict",sum:"3月、サイラスの裁判。配電盤の指紋や「いつか報いを受けさせる」と書いた昔の手紙など、証拠は手ごわかった。ジュリアンは携帯の件を証言するが、現物はない。評決は有罪、サイラスは12年の拘禁に。去り際、彼はジュリアンを恐怖の目で見つめた。2週間後、牧草地の東の沼地で叔母の遺体が発見され、事件は殺人に。ルースの車が当夜沼地付近で目撃されており、彼女が共犯として逮捕される。ジュリアンは限界寸前の日々を送る。そこへ警部から手紙が届く。",
p:`Silas Brandt went on trial in March. The evidence against him was {{formidable}}: his fingerprints on the fuse box, threads from his coat on the broken glass, and an old letter in which he had written that Margaret "would pay one day." His lawyers tried to {{nullify}} the letter as evidence. They failed.

I testified. I told the {{jury}} about the phone. The prosecutor smiled politely and asked where the phone was now. I had no answer. The {{verdict}} took only four hours: guilty of kidnapping. Silas was {{incarcerated|incarcerate}} for twelve years.

As they led him away, he looked straight at me. For the first time I saw no anger in his face. Only fear.

Two weeks later, a farmer's dog found my aunt. She was lying in the marsh east of the meadow, half-sunk in the black water, where the cold and the {{microbes}} had already done their slow work. The air smelled of {{methane}} and rot. It was no longer a kidnapping. It was {{murder}}.

The case was reopened. Ruth was {{arrested|arrest}} a day later; a witness had seen her car near the marsh on the night of the party. The newspapers decided she had been Margaret's accomplice, that the two women had argued over the money, and that the plan had {{run amok}} in the dark. It was a neat theory. Everyone liked it.

I felt {{lousy}}. I had pointed the police toward Ruth myself. For weeks I {{rarely}} slept, and when I did, I dreamed of grasshoppers. I was {{at the end of my rope|at the end of one's rope}}.

Then, on a {{gusty}} Tuesday morning, a letter arrived. It was from Detective Inspector Okafor.`},
{t:"The Mantis Hour",sum:"警部の手紙がすべてを覆す。①停電の瞬間に時計を見ていたのは、待っていたから。②「歪んだ小屋」を知っていたのは叔母とジュリアンだけ（思春期に二人で建てた）。③身代金メモの「くよくよするな」は彼自身の口癖。④沼地を探させなかったのは証拠を水に消させるため。⑤サイラスの指紋は、ジュリアン自身が配電盤の手伝いを頼んだから。叔母が共犯に選んだのはジュリアンだった。彼は「お遊び」の偽装誘拐を本物の死に変え、身代金と同じ500万の生命保険を唯一の相続人として得ようとしたのだ。携帯も彼が「発見」させ、自分で消去した。ルースは釈放、サイラスの判決は覆る。「カマキリは待つ。でも私もずっと待っていた」――そして追伸。",
p:`[letter]Dear Julian,

[letter]Thank you for writing all of this down. You write well. You are also, as you told me on the very first page, an {{open book}}. That was your mistake. You let me read you.

[letter]Allow me to point out a few things you wrote.

[letter]First: at 11:42 you were looking at your watch. Nobody at a party checks their watch at the exact second the lights die. Unless they are waiting for it.

[letter]Second: the ransom note said to leave the money under the crooked hut by the meadow. Ruth had never heard of that hut. Silas had never been to this town before October. But in our first interview you told me that you and your aunt built that hut together when you were an {{adolescent}}. Only two people in the world knew where it was. One of them was in the marsh.

[letter]Third: "Don't dwell on it." The note's words, and the first words of your own story. People {{seldom|rarely}} notice their own habits.

[letter]Fourth: you were very {{insistent}} that we should not search the marsh. Not even at gunpoint, you said. So we searched everywhere else for two weeks, long enough for the water to destroy most of what she could have told us, and long enough for Silas to be convicted.

[letter]Fifth: Silas's fingerprints were on the fuse box because you asked him to {{give you a hand|give a hand}} with it an hour before the party. You told me that yourself, quite proudly.

[letter]Here is what I believe. Your aunt chose you as her accomplice. Of course she did; she trusted you more than anyone. You cut the power. You drove her away in the dark. The burner phone was hers, and the unknown number was yours. And somewhere on that drive you decided that a staged kidnapping was a {{lark}}, but a real death was worth far more. Her life insurance pays five million, the same number you wrote on the ransom note, to her only {{heir}}. You.

[letter]You did not {{stumble upon}} that phone. You let me find it through you, so that you would look honest and Ruth would look guilty. Then you deleted the messages yourself, from the other phone, that same night.

[letter]I have not {{thrown in the towel|throw in the towel}}. Ruth was released this morning. Silas's conviction will be {{overturned|overturn}} by Friday. And there are two officers at your door as you read this.

[letter]Your aunt was right about one thing. The mantis never chases. It waits.

[letter]You thought you were the mantis, Julian. But I have been waiting, too.

[letter]D.I. Grace Okafor

[letter]P.S. The mantis case did not break by accident. It stood beside the fuse box, and you knocked it over in the dark on your way out. Your fingerprints are on the largest piece of glass. I kept it.`}
];

// ---------- state ----------
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("mh-known")||"[]"))}catch(e){}
function saveKnown(){try{localStorage.setItem("mh-known",JSON.stringify([...known]))}catch(e){}}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

// story words index
const storyKeys=new Set();
CH.forEach(c=>{c.keys=[];c.p.replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,(m,a,b)=>{const k=(b||a).toLowerCase();storyKeys.add(k);if(!c.keys.includes(k))c.keys.push(k);return m})});

// ---------- tabs ----------
const views={story:"v-story",book:"v-book",scene:"v-scene",phrase:"v-phrase",flash:"v-flash"};
function show(v){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===v));
  Object.entries(views).forEach(([k,id])=>document.getElementById(id).hidden=k!==v);
  if(v==="book")renderBook(); if(v==="scene")renderScene(); if(v==="phrase")renderPhrase(); if(v==="flash")nextCard(true);
  closeSheet();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.view));

// ---------- story ----------
let cur=0;
function renderToc(){
  const toc=document.getElementById("toc");
  toc.innerHTML=CH.map((c,i)=>`<button data-i="${i}" aria-current="${i===cur}"><span class="n">CHAPTER ${i+1}</span>${c.t}</button>`).join("");
  toc.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;renderStory();window.scrollTo({top:0})});
}
function markup(s){
  return esc(s).replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,(m,a,b)=>{const k=(b||a).toLowerCase();return MAP[k]?`<button class="vw" data-k="${esc(k)}">${a}</button>`:a});
}
function renderStory(){
  renderToc();
  const c=CH[cur];
  const paras=c.p.split(/\n\s*\n/).map(p=>{
    let cls="";p=p.trim();
    if(p.startsWith("[note]")){cls="note";p=p.slice(6)}
    else if(p.startsWith("[letter]")){cls="letter";p=p.slice(8)}
    return `<p class="${cls}">${markup(p)}</p>`}).join("");
  const words=c.keys.map(k=>`<button class="chip" data-k="${esc(k)}">${MAP[k].w}</button>`).join("");
  document.getElementById("reader").innerHTML=`
    <div class="case">Chapter ${cur+1} / ${CH.length}</div>
    <h2>${c.t}</h2>
    ${cur===0?'<p class="tip">点線の単語をタップすると意味・例文が出る。</p>':""}
    ${paras}
    <details class="sum"><summary>日本語あらすじ（ネタバレ注意）</summary><p>${c.sum}</p></details>
    <div class="eyebrow">この章の単語 · ${c.keys.length}</div>
    <div class="chwords">${words}</div>
    <div class="pager">
      <button class="btn ghost" id="prev" ${cur===0?"disabled":""}>← 前の章</button>
      <button class="btn" id="next" ${cur===CH.length-1?"disabled":""}>次の章 →</button>
    </div>`;
  document.getElementById("prev").onclick=()=>{cur--;renderStory();window.scrollTo({top:0})};
  document.getElementById("next").onclick=()=>{cur++;renderStory();window.scrollTo({top:0})};
}
document.getElementById("reader").addEventListener("click",e=>{
  const b=e.target.closest("[data-k]");if(!b)return;
  document.querySelectorAll(".vw.active").forEach(x=>x.classList.remove("active"));
  if(b.classList.contains("vw"))b.classList.add("active");
  openSheet(b.dataset.k);
});

// ---------- sheet ----------
const sheet=document.getElementById("sheet");let sheetKey=null;
function openSheet(k){
  const o=MAP[k];if(!o)return;sheetKey=k;
  document.getElementById("s-cat").textContent=lab(o)+(o.f?" · 意外と知らない":"");
  document.getElementById("s-w").textContent=o.w;
  document.getElementById("s-ja").textContent=o.ja;
  document.getElementById("s-def").textContent=o.def;
  document.getElementById("s-ex").textContent=o.ex;
  document.getElementById("s-exja").textContent=o.exja;
  syncStar();sheet.classList.add("open");
}
function syncStar(){const s=document.getElementById("s-star");const on=known.has(sheetKey);s.classList.toggle("on",on);s.textContent=on?"★ 覚えた":"☆ 覚えた"}
function closeSheet(){sheet.classList.remove("open");document.querySelectorAll(".vw.active").forEach(x=>x.classList.remove("active"))}
document.getElementById("s-close").onclick=closeSheet;
document.getElementById("s-star").onclick=()=>{known.has(sheetKey)?known.delete(sheetKey):known.add(sheetKey);saveKnown();syncStar()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

// ---------- word book ----------
let fCat="all",hideKnown=false;
const catsEl=document.getElementById("cats");
function renderCats(){
  const counts={};VOC.forEach(o=>counts[o.c]=(counts[o.c]||0)+1);
  const list=[["all","すべて",VOC.length],["story","小説に登場",[...storyKeys].length],...Object.keys(CATS).map(c=>[c,CATS[c],counts[c]||0])];
  catsEl.innerHTML=list.map(([k,l,n])=>`<button class="chip" data-c="${k}" aria-pressed="${fCat===k}">${l} ${n}</button>`).join("");
  catsEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{fCat=b.dataset.c;renderCats();renderBook()});
}
function renderBook(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const items=VOC.filter(o=>(fCat==="all"||(fCat==="story"?storyKeys.has(o.k):o.c===fCat))
    &&(!hideKnown||!known.has(o.k))
    &&(!q||(o.w+o.ja+o.def+o.ex).toLowerCase().includes(q)));
  document.getElementById("stat").textContent=`覚えた ${known.size} / ${VOC.length}`;
  const g=document.getElementById("grid");
  g.innerHTML=items.length?items.map(cardHTML).join(""):'<div class="empty">該当する単語がない。検索語かカテゴリーを変えてみて。</div>';
}
function cardHTML(o){return `
    <div class="card ${known.has(o.k)?"known":""}">
      <div class="card-head"><div class="w">${esc(o.w)}</div><button class="star ${known.has(o.k)?"on":""}" data-star="${esc(o.k)}">${known.has(o.k)?"★":"☆"} 覚えた</button></div>
      <div class="cat">${lab(o)}${o.f?' · <span class="badge">意外と知らない</span>':""}${storyKeys.has(o.k)?' · <span class="inStory">小説に登場</span>':""}</div>
      <div class="ja">${esc(o.ja)}</div>
      <div class="def">${esc(o.def)}</div>
      <div class="ex">${esc(o.ex)}</div>
      <div class="exja">${esc(o.exja)}</div>
    </div>`}
document.getElementById("grid").addEventListener("click",e=>{const b=e.target.closest("[data-star]");if(!b)return;const k=b.dataset.star;known.has(k)?known.delete(k):known.add(k);saveKnown();renderBook()});
document.getElementById("q").addEventListener("input",renderBook);
document.getElementById("hideKnown").onclick=e=>{hideKnown=!hideKnown;e.target.setAttribute("aria-pressed",hideKnown);renderBook()};

// ---------- scenes ----------
let sCat="all",sTricky=false,sHide=false;
function renderSCats(){
  const counts={};SCN.forEach(o=>counts[o.c]=(counts[o.c]||0)+1);
  const list=[["all","すべて",SCN.length],...Object.keys(SC).map(c=>[c,SC[c],counts[c]])];
  const el=document.getElementById("scats");
  el.innerHTML=list.map(([k,l,n])=>`<button class="chip" data-c="${k}" aria-pressed="${sCat===k}">${l} ${n}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{sCat=b.dataset.c;renderSCats();renderScene()});
}
function renderScene(){
  const q=document.getElementById("sq").value.trim().toLowerCase();
  const items=SCN.filter(o=>(sCat==="all"||o.c===sCat)&&(!sTricky||o.f)&&(!sHide||!known.has(o.k))&&(!q||(o.w+o.ja+o.def+o.ex).toLowerCase().includes(q)));
  document.getElementById("sstat").textContent=`覚えた ${SCN.filter(o=>known.has(o.k)).length} / ${SCN.length}`;
  document.getElementById("sgrid").innerHTML=items.length?items.map(cardHTML).join(""):'<div class="empty">該当する単語がない。検索語か場面を変えてみて。</div>';
}
document.getElementById("sgrid").addEventListener("click",e=>{const b=e.target.closest("[data-star]");if(!b)return;const k=b.dataset.star;known.has(k)?known.delete(k):known.add(k);saveKnown();renderScene()});
document.getElementById("sq").addEventListener("input",renderScene);
document.getElementById("sTricky").onclick=e=>{sTricky=!sTricky;e.target.setAttribute("aria-pressed",sTricky);renderScene()};
document.getElementById("sHide").onclick=e=>{sHide=!sHide;e.target.setAttribute("aria-pressed",sHide);renderScene()};
renderSCats();

// ---------- phrases ----------
let pCat="all",pHide=false;
function phraseHTML(o){const on=known.has(o.k);return `
    <div class="card ${on?"known":""}">
      <div class="card-head"><div class="w">${esc(o.w)}</div><button class="star ${on?"on":""}" data-star="${esc(o.k)}">${on?"★":"☆"} 覚えた</button></div>
      <div class="cat">${PC[o.pc]}</div>
      <div class="ja">${esc(o.ja)}</div>
      <div class="ex">${esc(o.ex)}</div>
      <div class="exja">${esc(o.exja)}</div>
      <div class="sims"><div class="lbl">類似表現</div>${o.sims.map(([a,b])=>`<div class="sim"><b>${esc(a)}</b><span>${esc(b||"")}</span></div>`).join("")}</div>
    </div>`}
function renderPCats(){
  const counts={};PHR.forEach(o=>counts[o.pc]=(counts[o.pc]||0)+1);
  const list=[["all","すべて",PHR.length],...Object.keys(PC).map(c=>[c,PC[c],counts[c]])];
  const el=document.getElementById("pcats");
  el.innerHTML=list.map(([k,l,n])=>`<button class="chip" data-c="${k}" aria-pressed="${pCat===k}">${l} ${n}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{pCat=b.dataset.c;renderPCats();renderPhrase()});
}
function renderPhrase(){
  const q=document.getElementById("pq").value.trim().toLowerCase();
  const items=PHR.filter(o=>(pCat==="all"||o.pc===pCat)&&(!pHide||!known.has(o.k))&&(!q||(o.w+o.ja+o.ex+o.exja+o.sims.flat().join(" ")).toLowerCase().includes(q)));
  document.getElementById("pstat").textContent=`覚えた ${PHR.filter(o=>known.has(o.k)).length} / ${PHR.length}`;
  document.getElementById("pgrid").innerHTML=items.length?items.map(phraseHTML).join(""):'<div class="empty">該当する表現がない。検索語かカテゴリーを変えてみて。</div>';
}
document.getElementById("pgrid").addEventListener("click",e=>{const b=e.target.closest("[data-star]");if(!b)return;const k=b.dataset.star;known.has(k)?known.delete(k):known.add(k);saveKnown();renderPhrase()});
document.getElementById("pq").addEventListener("input",renderPhrase);
document.getElementById("pHide").onclick=e=>{pHide=!pHide;e.target.setAttribute("aria-pressed",pHide);renderPhrase()};
renderPCats();

// ---------- flashcards ----------
const fcat=document.getElementById("fcat"),fdir=document.getElementById("fdir"),fc=document.getElementById("fc");
fcat.innerHTML=`<option value="all">すべて</option><option value="story">小説に登場</option>`+Object.entries(CATS).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")+`<option value="scn">場面別：すべて</option><option value="tricky">場面別：意外と知らない語</option>`+Object.entries(SC).map(([k,l])=>`<option value="${k}">場面別：${l}</option>`).join("")+`<option value="phr">日常表現：すべて</option>`;
let deck=[],card=null,flipped=false;
function buildDeck(){const v=fcat.value;const pool=v==="phr"?PHR:(v==="scn"||v==="tricky"||SC[v])?SCN:VOC;deck=pool.filter(o=>(v==="all"||v==="scn"||v==="phr"||(v==="tricky"?o.f:v==="story"?storyKeys.has(o.k):o.c===v))&&!known.has(o.k));for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function nextCard(rebuild){
  if(rebuild||!deck.length)buildDeck();
  card=deck.shift()||null;flipped=false;drawCard();
}
function drawCard(){
  const st=document.getElementById("fstat");
  if(!card){fc.innerHTML=`<div class="w">完了！</div><div class="hint">このカテゴリーは全部「覚えた」になった。単語帳で★を外すと復習できる。</div>`;st.textContent="";return}
  const en=fdir.value==="en";
  if(!flipped){fc.innerHTML=en?`<div class="cat">${lab(card)}</div><div class="w">${esc(card.w)}</div><div class="hint">タップでめくる</div>`
    :`<div class="cat">${lab(card)}</div><div class="ja" style="font-size:22px">${esc(card.ja)}</div><div class="hint">タップでめくる</div>`}
  else{fc.innerHTML=`<div class="w">${esc(card.w)}</div><div class="ja">${esc(card.ja)}</div><div class="def">${esc(card.def)}</div><div class="ex">${esc(card.ex)}</div><div class="exja">${esc(card.exja)}</div>`}
  st.textContent=`残り ${deck.length+1} 枚 · 覚えた ${known.size}`;
}
fc.onclick=()=>{if(card){flipped=!flipped;drawCard()}};
fc.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();fc.click()}};
document.getElementById("fagain").onclick=()=>{if(card)deck.splice(Math.min(deck.length,4),0,card);nextCard(false)};
document.getElementById("fknow").onclick=()=>{if(card){known.add(card.k);saveKnown()}nextCard(false)};
fcat.onchange=()=>nextCard(true);fdir.onchange=()=>{flipped=false;drawCard()};

renderCats();renderStory();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
